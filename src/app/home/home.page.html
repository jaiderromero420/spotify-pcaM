<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    
    <ion-buttons slot="start">
      <ion-menu-button menu="first" color="success"></ion-menu-button>
    </ion-buttons>

    <ion-title class="xbox-title">X-MUSIC</ion-title>
    
    <ion-buttons slot="end">
      <ion-button (click)="irAFavoritos()">
        <ion-icon name="folder-open-outline" color="medium"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [class.dark-theme]="isDarkTheme" [class.light-theme]="!isDarkTheme" class="xbox-content">
  
  <div class="hero-section">
    <swiper-container autoplay="true" loop="true" class="hero-swiper">
      <swiper-slide *ngFor="let song of songs">
        <div class="hero-card">
          <img [src]="song.image" alt="Cover">
          <div class="hero-overlay">
            <h1>{{ song.title }}</h1>
            <p>{{ song.artist }}</p>
          </div>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>

  <div class="category-buttons ion-padding">
    <ion-button expand="block" class="xbox-btn" (click)="abrirFiltroGeneros()">
      <ion-icon name="musical-notes" slot="start"></ion-icon>
      Géneros
    </ion-button>
    <ion-button expand="block" class="xbox-btn outline" fill="outline" (click)="abrirFiltroAlbumes()">
      <ion-icon name="albums" slot="start"></ion-icon>
      Todos
    </ion-button>
  </div>

  <div class="section-title">
    <h2>Canciones</h2>
    <span (click)="cambiarColor()">
      <ion-icon name="contrast-outline"></ion-icon> Tema
    </span>
  </div>

  <ion-list lines="none" class="xbox-list">
    <ion-item *ngFor="let song of songs" button detail="false" class="xbox-item" (click)="showSong(song)">
      <div slot="start" class="play-indicator"><ion-icon name="play"></ion-icon></div>
      <ion-thumbnail slot="start" class="song-thumb"><img [src]="song.image"></ion-thumbnail>
      <ion-label>
        <h3>{{ song.title }}</h3>
        <p>{{ song.artist }}</p>
      </ion-label>
      <ion-buttons slot="end">
        <ion-button (click)="toggleFavorite(song, $event)">
          <ion-icon slot="icon-only" [name]="isFavorite(song) ? 'heart' : 'heart-outline'" [color]="isFavorite(song) ? 'danger' : 'medium'"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-item>
  </ion-list>
  
  <div style="height: 120px;"></div>
</ion-content>

<ion-footer *ngIf="song.preview_url" class="music-footer">
  <ion-progress-bar [value]="newTime || 0" color="success"></ion-progress-bar>
  
  <ion-toolbar color="dark" style="--background: #111; border-top: 1px solid #333;">
    <ion-grid>
      <ion-row class="ion-align-items-center">
        
        <ion-col size="2">
          <ion-thumbnail style="width: 40px; height: 40px; border-radius: 4px; overflow: hidden;">
            <img [src]="song.image || 'assets/icon/favicon.png'">
          </ion-thumbnail>
        </ion-col>

        <ion-col size="6">
          <ion-label>
            <h3 style="margin:0; font-size: 0.9rem; font-weight: bold; color: rgb(25, 102, 6);">{{ song.name }}</h3>
            <p style="margin:0; font-size: 0.7rem; color: #39ff14;">
              {{ formatTime(currentAudio?.currentTime || 0) }} / {{ formatTime(currentAudio?.duration || 0) }}
            </p>
          </ion-label>
        </ion-col>

        <ion-col size="4" class="ion-text-end">
          <ion-button fill="clear" size="small" (click)="song.playing ? pause() : play()">
            <ion-icon [name]="song.playing ? 'pause' : 'play'" style="font-size: 24px; color: rgb(0, 0, 0);"></ion-icon>
          </ion-button>
          <ion-button fill="clear" size="small" (click)="nextSong()">
            <ion-icon name="play-skip-forward" style="font-size: 24px; color: rgb(0, 0, 0);"></ion-icon>
          </ion-button>
        </ion-col>

      </ion-row>
    </ion-grid>
  </ion-toolbar>
</ion-footer>
