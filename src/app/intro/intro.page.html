<ion-content [fullscreen]="true">
  
  <swiper-container pagination="true" class="intro-swiper">
    <swiper-slide *ngFor="let slide of slides">
      
      <div class="slide-content" 
           [ngClass]="{
             'theme-orange': slide.color === 'orange',
             'theme-blue': slide.color === 'blue',
             'theme-green': slide.color === 'green'
           }">
        
        <div class="image-box">
           <img [src]="slide.image" alt="Slide Image" />
        </div>

        <h2>{{ slide.title }}</h2>
        <p>{{ slide.desc }}</p>

      </div>

    </swiper-slide>
  </swiper-container>

  <div class="btn-container">
    <ion-button expand="block" shape="round" class="btn-intro" (click)="finalizarIntro()">
      Vamos a rockear
      <ion-icon slot="end" name="musical-notes"></ion-icon>
    </ion-button>
  </div>

</ion-content>
